name: Release

run-name: 自动打包exe,并挂到${{ github.event.release.name }}

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: 安装依赖和打包工具
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 打包成 exe
        run: pyinstaller --onefile --name quiz-ai-helper app.py

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/quiz-ai-helper.exe
          tag_name: ${{ github.event.release.tag_name }}
